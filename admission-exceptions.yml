# Public source skills discovered on 2026-08-25 but not yet admitted to the
# portable catalog. Fix these issues in the source repository, then register
# and synchronize the skill again.
exceptions:
  - repo: HYGON-AI/inference-cookbook-das
    path: .claude/skills/add-model
    reasons:
      - SKILL.md exceeds the 500-line portability limit.
      - A relative link escapes the standalone skill directory.
  - repo: HYGON-AI/inference-cookbook-das
    path: .claude/skills/bulk-add-model
    reasons:
      - The skill requires ../add-model/SKILL.md, which is not bundled in the standalone installation.
      - Re-admit it only after the source team makes the dependency self-contained and validates the installed package.
